spring:
  datasource:
    url: jdbc:h2:mem:expense_tracker_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000
  security:
    enabled: false
  jwt:
    secret: test-only-secret-key-not-for-production-use-minimum-256-bits-long
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30
    issuer: expense-tracker-test
    cookie-secure: false

logging:
  level:
    root: WARN
    com.expensetracker: INFO

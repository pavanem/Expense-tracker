# Copy to /etc/fail2ban/filter.d/expense-tracker-auth.conf
#
# Matches repeated failed/blocked attempts against the login and
# registration endpoints specifically, from Nginx's access log
# (docker-compose.yml bind-mounts this to ./logs/nginx/access.log).
#
# Status codes matched:
#   401 - wrong username/password (InvalidCredentialsException)
#   423 - account currently locked out (AccountLockedException)
#   429 - Nginx's own rate limit already kicked in (Phase 2)
#
# Nginx sees the real client IP directly here (no reverse proxy in front of
# it), so $remote_addr — which fail2ban's <HOST> token matches — is accurate.

[Definition]
failregex = ^<HOST> -.*"POST /api/auth/(login|register) HTTP/\d\.\d" (401|423|429) \d+
ignoreregex =

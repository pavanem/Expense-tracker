name: Deploy to Home Server

on:
  push:
    branches: [main]
  workflow_dispatch:          # lets you trigger a deploy manually from GitHub UI
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

# Prevent two deploys running at the same time.
# If a deploy is already in progress and another push lands, the new one
# queues — it does NOT cancel the in-progress run (that would leave the
# server in a half-deployed state).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Optional: uncomment this job and add `needs: test` to the deploy job
  # below to run Maven tests before every deploy.
  # ---------------------------------------------------------------------------
  # test:
  #   name: Run Tests
  #   runs-on: self-hosted
  #   steps:
  #     - name: Run Maven tests
  #       run: |
  #         cd /home/pavan/Apps/Expense-Tracker/backend
  #         mvn test --no-transfer-progress
  # ---------------------------------------------------------------------------

  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    # needs: test          # ← uncomment when you enable the test job above
    timeout-minutes: 15   # fail the deploy if it hangs (e.g. stuck Docker build)

    steps:
      # ── 1. Pull latest code ──────────────────────────────────────────────
      - name: Pull latest code
        run: |
          cd /home/pavan/Apps/Expense-Tracker
          git fetch origin main
          git reset --hard origin/main
        # reset --hard instead of pull so the working tree always matches main
        # exactly, even if someone manually edited a file on the server.

      # ── 2. Build images & restart containers ─────────────────────────────
      - name: Build & restart services
        run: |
          cd /home/pavan/Apps/Expense-Tracker
          docker compose up -d --build --remove-orphans
        # --remove-orphans cleans up containers for services removed from
        # docker-compose.yml between deploys.

      # ── 3. Wait for containers to initialise ─────────────────────────────
      - name: Wait for services to initialise
        run: |
          echo "Waiting for containers to start..."
          sleep 20

      # ── 4. Health check — backend ─────────────────────────────────────────
      - name: Health check — backend
        run: |
          echo "Checking backend health..."
          for i in {1..6}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' expense-tracker-backend 2>/dev/null || echo "not found")
            echo "  Attempt $i/6 — backend: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ $i -eq 6 ]; then
              echo "❌ Backend did not become healthy in time"
              docker logs expense-tracker-backend --tail 50
              exit 1
            fi
            sleep 10
          done

      # ── 5. Health check — frontend ────────────────────────────────────────
      - name: Health check — frontend (HTTP)
        run: |
          echo "Checking frontend HTTP response..."
          curl -sf --max-time 10 http://localhost/ -o /dev/null \
            && echo "✅ Frontend is responding" \
            || { echo "❌ Frontend did not respond"; exit 1; }

      # ── 6. Summary ────────────────────────────────────────────────────────
      - name: Show running containers
        if: always()    # runs even if an earlier step failed
        run: |
          cd /home/pavan/Apps/Expense-Tracker
          docker compose ps

# Serves the built React SPA and reverse-proxies /api/** to the Spring Boot
# backend so the browser only ever talks to a single origin. This is what
# lets the frontend's Axios client default to a relative '/api' base URL.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: hashed filenames from the Vite build, safe to cache hard.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: any non-file route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend. proxy_pass has no path component here,
    # so Nginx forwards the full original URI (including the /api prefix)
    # unchanged — which matches the backend's own @RequestMapping("/api/...").
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger / OpenAPI, handy to reach through the same origin during setup.
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}

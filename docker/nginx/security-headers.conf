# Included (not templated — no ${DOMAIN} needed) into every location that
# needs these. Nginx quirk worth knowing: add_header directives do NOT
# inherit into a location that defines its own add_header (e.g. the static
# assets location below, which sets Cache-Control) — so this file is
# explicitly included there too, not just at the server level.

# Forces HTTPS for future visits. 6 months to start; raise once you're
# confident the cert/renewal pipeline is solid, and only then consider
# `preload` (that's a one-way door — hard to undo once submitted).
add_header Strict-Transport-Security "max-age=15768000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

# 'unsafe-inline' in style-src is required by MUI/Emotion (CSS-in-JS injects
# <style> tags at runtime) — there's no practical way around this without a
# nonce-based build pipeline this project doesn't have. Everything else is
# locked to 'self' plus the two Google Fonts hosts actually used.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

# Explicitly disabled rather than left default — the legacy browser XSS
# auditor this controls has its own history of introducing vulnerabilities,
# and CSP above is the actual XSS mitigation.
add_header X-XSS-Protection "0" always;

name: Deploy to Home Server

on:
  push:
    branches: [main]
  workflow_dispatch:          # lets you trigger a deploy or rollback manually from GitHub UI
    inputs:
      commit_sha:
        description: "Commit SHA, branch, or tag to deploy/rollback to (leave blank for latest main)"
        required: false
        default: ""
      reason:
        description: "Reason for manual deploy / rollback"
        required: false
        default: "Manual trigger"

# Prevent two deploys running at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Quality Gate: Run Cucumber Acceptance & Regression Tests
  # ---------------------------------------------------------------------------
  acceptance-tests:
    name: Acceptance Tests (Quality Gate)
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || '' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure Maven is available
        run: |
          # 1. Try existing PATH & profiles
          [ -s "$HOME/.bashrc" ] && source "$HOME/.bashrc" 2>/dev/null || true
          [ -s "$HOME/.profile" ] && source "$HOME/.profile" 2>/dev/null || true
          [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ] && source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null || true
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/share/maven/bin:/opt/maven/bin:$HOME/.sdkman/candidates/maven/current/bin:$HOME/.m2/bin:$HOME/.maven-portable/bin

          # 2. Auto-install portable Maven 3.9.9 if still missing
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found in system PATH. Auto-installing portable Maven 3.9.9 to $HOME/.maven-portable..."
            mkdir -p "$HOME/.maven-portable"
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz | tar -xz -C "$HOME/.maven-portable" --strip-components=1
            export PATH="$HOME/.maven-portable/bin:$PATH"
          fi

          echo "Maven location: $(which mvn)"
          mvn -version

      - name: Run backend tests and install artifact locally
        run: |
          [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ] && source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null || true
          export PATH=$PATH:$HOME/.maven-portable/bin:/usr/local/bin:/usr/bin:/bin:/usr/share/maven/bin:/opt/maven/bin:$HOME/.sdkman/candidates/maven/current/bin
          cd backend
          mvn clean test --no-transfer-progress
          mvn install -DskipTests --no-transfer-progress

      - name: Run Cucumber acceptance tests
        run: |
          [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ] && source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null || true
          export PATH=$PATH:$HOME/.maven-portable/bin:/usr/local/bin:/usr/bin:/bin:/usr/share/maven/bin:/opt/maven/bin:$HOME/.sdkman/candidates/maven/current/bin
          cd acceptance-tests
          mvn clean test --no-transfer-progress

  # ---------------------------------------------------------------------------
  # Deploy: Only runs if acceptance-tests quality gate passes
  # ---------------------------------------------------------------------------
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    needs: acceptance-tests
    timeout-minutes: 15

    steps:
      # ── 1. Pull target code (supports rollback to specific commit/tag) ────
      - name: Pull target code
        run: |
          cd /home/pavan/Apps/Expense-Tracker
          git fetch origin
          TARGET_REF="${{ github.event.inputs.commit_sha }}"
          if [ -z "$TARGET_REF" ]; then
            echo "Deploying latest origin/main..."
            git reset --hard origin/main
          else
            echo "Rolling back / deploying specific ref: $TARGET_REF"
            git reset --hard "origin/$TARGET_REF" 2>/dev/null || git reset --hard "$TARGET_REF"
          fi
          echo "Currently deployed commit:"
          git log -1 --oneline

      # ── 2. Build images & restart containers ─────────────────────────────
      - name: Build & restart services
        run: |
          cd /home/pavan/Apps/Expense-Tracker
          docker compose up -d --build --remove-orphans

      # ── 3. Wait for containers to initialise ─────────────────────────────
      - name: Wait for services to initialise
        run: |
          echo "Waiting for containers to start..."
          sleep 30

      # ── 4. Health check — backend ─────────────────────────────────────────
      - name: Health check — backend
        run: |
          echo "Checking backend health..."
          for i in {1..6}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' expense-tracker-backend 2>/dev/null || echo "not found")
            echo "  Attempt $i/6 — backend: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ $i -eq 6 ]; then
              echo "❌ Backend did not become healthy in time"
              docker logs expense-tracker-backend --tail 50
              exit 1
            fi
            sleep 10
          done

      # ── 5. Health check — frontend ────────────────────────────────────────
      - name: Health check — frontend (HTTP)
        run: |
          echo "Checking frontend HTTP response..."
          for i in {1..6}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://localhost/ 2>/dev/null || echo "000")
            echo "  Attempt $i/6 — HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Frontend is responding (HTTP $HTTP_CODE)"
              break
            fi
            if [ $i -eq 6 ]; then
              echo "❌ Frontend did not respond after 6 attempts"
              echo "--- Frontend container logs (last 50 lines) ---"
              docker logs expense-tracker-frontend --tail 50
              echo "--- Container status ---"
              docker inspect --format='{{.State.Status}} / {{.State.Health.Status}}' expense-tracker-frontend 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

      # ── 6. Summary ────────────────────────────────────────────────────────
      - name: Show running containers
        if: always()
        run: |
          cd /home/pavan/Apps/Expense-Tracker
          docker compose ps

spring:
  application:
    name: expense-tracker-acceptance-tests

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: http://localhost:3000
  security:
    enabled: true
  jwt:
    secret: AcceptanceTestsJwtSecretKeyMustBeAtLeast32BytesLongForHS256Validation1234567890!
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30
    issuer: expense-tracker-test
    cookie-secure: false

# Copy to /etc/fail2ban/action.d/ntfy.conf
#
# Sends a push notification to your phone (via the ntfy app, or any
# browser) whenever fail2ban bans an IP. No account, no API key — just pick
# a hard-to-guess topic name (treat it like a password: anyone who knows it
# can read your notifications) and subscribe to it in the ntfy app.
#
# The topic name is set per-jail in jail.local via ntfy_topic = ...

[Definition]
actionstart =
actionstop =
actioncheck =

actionban = curl -s \
              -H "Title: fail2ban: banned <ip>" \
              -H "Priority: high" \
              -H "Tags: rotating_light" \
              -d "Jail: <name>  Banned: <ip>  Failures so far: <failures>" \
              "https://ntfy.sh/%(ntfy_topic)s" >/dev/null

actionunban =

[Init]
ntfy_topic = CHANGE_ME_SET_IN_JAIL_LOCAL

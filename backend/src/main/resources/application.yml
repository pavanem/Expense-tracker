spring:
  application:
    name: expense-tracker-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
    username: ${DB_USERNAME:expense_user}
    password: ${DB_PASSWORD:expense_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 20
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.expensetracker: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/expense-tracker.log

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80}
  security:
    enabled: ${SECURITY_ENABLED:false}
  jwt:
    # HS256 signing key — MUST be overridden via JWT_SECRET in any real
    # deployment (see JwtService, which refuses to start on the placeholder
    # value once app.security.enabled=true). Generate one with:
    #   openssl rand -base64 64
    secret: ${JWT_SECRET:CHANGE_ME_INSECURE_DEFAULT_DO_NOT_USE_IN_PRODUCTION_1234567890}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}
    issuer: expense-tracker
    # Whether the refresh-token cookie requires HTTPS. Off by default since
    # the standard deployment here (Nginx over plain HTTP on the LAN/
    # Tailscale) has no TLS. Set JWT_COOKIE_SECURE=true if you put this
    # behind HTTPS (e.g. `tailscale serve` or a reverse proxy with a cert) —
    # browsers silently refuse to send Secure cookies over plain HTTP.
    cookie-secure: ${JWT_COOKIE_SECURE:false}
